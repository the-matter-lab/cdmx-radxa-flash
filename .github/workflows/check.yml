name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - run: python -m pip install -r host/requirements.txt pyinstaller
      - run: make test
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: "Get-ChildItem site/*.ps1 | ForEach-Object { [scriptblock]::Create((Get-Content $_ -Raw)) | Out-Null }"
      - run: pyinstaller --clean --noconfirm host/cdmx_imager.spec
      - run: test -x dist/CDMX-Radxa-Flasher

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r host/requirements.txt pyinstaller
      - run: python -m unittest tests/test_imager_app.py
      - name: Exercise Windows SD/USB disk-state transitions
        shell: powershell
        run: .\tests\windows\prepare-disk.tests.ps1
      - name: Validate Windows launcher syntax
        shell: powershell
        run: Get-ChildItem site/*.ps1, host/windows/*.ps1 | ForEach-Object { [scriptblock]::Create((Get-Content $_ -Raw)) | Out-Null }
      - run: pyinstaller --clean --noconfirm host/cdmx_imager.spec
      - name: Verify packaged helper
        shell: powershell
        run: |
          if (-not (Test-Path dist/CDMX-Radxa-Flasher.exe)) { throw "Windows helper was not packaged" }
