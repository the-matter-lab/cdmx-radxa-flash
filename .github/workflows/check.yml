name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r host/requirements.txt pyinstaller
      - run: make test
      - run: pyinstaller --clean --noconfirm host/cdmx_imager.spec
      - run: test -x dist/CDMX-Radxa-Flasher
