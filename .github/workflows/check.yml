name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - run: python -m pip install -r host/requirements.txt pyinstaller
      - run: make test
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: "Get-ChildItem site/*.ps1 | ForEach-Object { [scriptblock]::Create((Get-Content $_ -Raw)) | Out-Null }"
      - run: pyinstaller --clean --noconfirm host/cdmx_imager.spec
      - run: test -x dist/CDMX-Radxa-Flasher
